services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    image: redis:7-alpine
    container_name: helpdesk-pro-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env before production deployment}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env before production deployment}", "--appendonly", "yes"]
    volumes:
      - helpdesk_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    container_name: helpdesk-pro-clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: helpdesk-pro-server:${IMAGE_TAG:-latest}
    container_name: helpdesk-pro-migrate
    restart: "no"
    working_dir: /app/server
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_USER: ${APP_DATABASE_USER:-helpdesk_app}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD must be set in .env before production deployment}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "src/db/provisionAppRole.js"]

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: helpdesk-pro-server:${IMAGE_TAG:-latest}
    container_name: helpdesk-pro-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${APP_DATABASE_USER:-helpdesk_app}:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD must be set in .env before production deployment}@postgres:5432/${POSTGRES_DB}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD must be set in .env before production deployment}
      RUN_MIGRATIONS_ON_START: "false"
      SEED_REFERENCE_DATA_ON_START: "false"
      RETENTION_ENABLED: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-local_dev_change_me}@redis:6379
      UPLOAD_DIR: /app/server/uploads
      AV_QUARANTINE_DIR: /app/server/quarantine
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      AV_ENABLED: "true"
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set to the public origin in .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - helpdesk_uploads:/app/server/uploads
      - helpdesk_quarantine:/app/server/quarantine
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    image: helpdesk-pro-web:${IMAGE_TAG:-latest}
    container_name: helpdesk-pro-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  helpdesk_pgdata:
  helpdesk_uploads:
  helpdesk_quarantine:
  helpdesk_redis:
